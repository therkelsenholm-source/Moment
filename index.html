<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moment</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --ink: #1d1c1a; --muted: #8a867f;
    --line: #e4e0d9; --accent: #b08d57; --accent-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131211; --card: #1d1c1a; --ink: #f1eee8; --muted: #8f8a82; --line: #2e2c29; --accent: #c9a66b; --accent-ink: #131211; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  h1 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; margin: 0; }
  #conn { font-size: 12px; color: var(--muted); }
  #conn.ok::before { content: "● "; color: #5a9e6f; }
  #conn.bad::before { content: "● "; color: #c0574b; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 14px; }
  .src { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #title { font-size: 22px; font-weight: 600; margin: 6px 0 2px; min-height: 30px; }
  #artist { color: var(--muted); min-height: 20px; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin: 18px 0 6px; overflow: hidden; }
  #prog { height: 100%; width: 0; background: var(--accent); transition: width .9s linear; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .transport { display: flex; justify-content: center; gap: 18px; margin-top: 14px; }
  button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:active { transform: scale(.96); }
  .round { width: 52px; height: 52px; display: grid; place-items: center; }
  .round svg { width: 20px; height: 20px; fill: currentColor; }
  #playpause { width: 64px; height: 64px; background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .vol { display: flex; align-items: center; gap: 12px; }
  .vol input { flex: 1; accent-color: var(--accent); }
  #volnum { width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  #mute.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #mute { padding: 6px 12px; font-size: 13px; }
  h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  #sources { display: flex; flex-wrap: wrap; gap: 8px; }
  #sources button { padding: 8px 14px; font-size: 14px; }
  #sources button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #queue { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; }
  #queue li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  #queue li:last-child { border-bottom: 0; }
  #queue .n { color: var(--muted); width: 22px; font-variant-numeric: tabular-nums; }
  #queue .a { color: var(--muted); font-size: 13px; }
  #queue li.now .t { color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; }
  #err { color: #c0574b; font-size: 13px; min-height: 18px; text-align: center; }
  .foot { display: flex; justify-content: center; }
  #standby { padding: 8px 16px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header><h1>BeoSound Moment</h1><span id="conn">forbinder…</span></header>

  <section class="card">
    <div class="src" id="srcname">–</div>
    <div id="title">Intet spiller</div>
    <div id="artist"></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div class="transport">
      <button class="round" id="prev" title="Forrige"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button class="round" id="playpause" title="Afspil/pause"><svg viewBox="0 0 24 24" id="ppicon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="round" id="next" title="Næste"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
  </section>

  <section class="card">
    <h2>Lydstyrke</h2>
    <div class="vol">
      <input type="range" id="vol" min="0" max="90" value="0" aria-label="Lydstyrke">
      <span id="volnum">0</span>
      <button id="mute">Lyd fra</button>
    </div>
  </section>

  <section class="card">
    <h2>Kilde</h2>
    <div id="sources"><span class="empty">Henter kilder…</span></div>
  </section>

  <section class="card">
    <h2>Kø</h2>
    <ul id="queue"><li class="empty">Henter kø…</li></ul>
  </section>

  <div id="err"></div>
  <div class="foot"><button id="standby">Sæt på standby</button></div>
</main>

<script>
const $ = id => document.getElementById(id);
const st = { playing: false, muted: false, source: null, pos: 0, dur: 0, queueId: null, dragging: false };
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const HIDDEN = ["ALARM", "QPLAY"];

function fmt(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function err(msg) { $("err").textContent = msg || ""; if (msg) setTimeout(() => { if ($("err").textContent === msg) $("err").textContent = ""; }, 4000); }

async function api(method, path, body) {
  const r = await fetch("/api" + path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { err(`${method} ${path} gav ${r.status}`); throw new Error(r.status); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

// Tastetryk sendes som "tryk" + "slip", som fjernbetjeningen gør.
async function press(cmd) {
  try { await api("POST", `/BeoZone/Zone/Stream/${cmd}`); await api("POST", `/BeoZone/Zone/Stream/${cmd}/Release`); } catch {}
}

function renderPlay() { $("ppicon").innerHTML = st.playing ? PAUSE : PLAY; }
function renderProgress() {
  $("pos").textContent = fmt(st.pos); $("dur").textContent = st.dur ? fmt(st.dur) : "";
  $("prog").style.width = st.dur ? Math.min(100, st.pos / st.dur * 100) + "%" : "0";
}
function renderVolume(level, muted) {
  if (level != null && !st.dragging) { $("vol").value = level; $("volnum").textContent = level; }
  if (muted != null) { st.muted = muted; $("mute").classList.toggle("on", muted); $("mute").textContent = muted ? "Lyd til" : "Lyd fra"; }
}
function markSource() {
  document.querySelectorAll("#sources button").forEach(b => b.classList.toggle("active", b.dataset.id === st.source));
  const b = document.querySelector(`#sources button[data-id="${CSS.escape(st.source || "")}"]`);
  $("srcname").textContent = b ? b.textContent : "–";
}

async function loadSources() {
  const d = await api("GET", "/BeoZone/Zone/Sources/");
  const box = $("sources"); box.innerHTML = "";
  for (const [id, s] of d.sources) {
    if (HIDDEN.some(h => id.toUpperCase().startsWith(h + ":"))) continue;
    const b = document.createElement("button");
    b.textContent = s.friendlyName === "Music" ? "Deezer" : s.friendlyName === "Music stream" ? "DLNA" : s.friendlyName;
    b.dataset.id = id;
    b.onclick = () => api("POST", "/BeoZone/Zone/ActiveSources", { primaryExperience: { source: { id } } }).catch(() => {});
    box.appendChild(b);
  }
  markSource();
}

async function loadQueue() {
  try {
    const d = await api("GET", "/BeoZone/Zone/PlayQueue/");
    const items = d.playQueue?.playQueueItem || [];
    const ul = $("queue"); ul.innerHTML = "";
    if (!items.length) { ul.innerHTML = '<li class="empty">Køen er tom</li>'; return; }
    items.forEach((it, i) => {
      const li = document.createElement("li"); li.dataset.id = it.id;
      const name = it.track?.name || it.station?.name || it.id;
      const artist = it.track?.artistName || "";
      li.innerHTML = `<span class="n">${i + 1}</span><span><div class="t"></div><div class="a"></div></span>`;
      li.querySelector(".t").textContent = name; li.querySelector(".a").textContent = artist;
      ul.appendChild(li);
    });
    markQueue();
  } catch { $("queue").innerHTML = '<li class="empty">Kunne ikke hente køen</li>'; }
}
function markQueue() { document.querySelectorAll("#queue li").forEach(li => li.classList.toggle("now", li.dataset.id === st.queueId)); }

async function loadInitial() {
  try {
    const v = await api("GET", "/BeoZone/Zone/Sound/Volume");
    renderVolume(v.volume.speaker.level, v.volume.speaker.muted);
    const a = await api("GET", "/BeoZone/Zone/ActiveSources/");
    st.source = a.activeSources?.primary || null;
    await loadSources();
  } catch {}
  loadQueue();
}

function onNotification(n) {
  const d = n.data || {};
  switch (n.type) {
    case "VOLUME":
      if (d.speaker) renderVolume(d.speaker.level, d.speaker.muted); break;
    case "SOURCE":
      st.source = d.primary || null; markSource(); loadQueue(); break;
    case "PROGRESS_INFORMATION":
      st.playing = d.state === "play"; st.pos = d.position || 0; st.dur = d.totalDuration || 0;
      if (d.playQueueItemId) { st.queueId = d.playQueueItemId; markQueue(); }
      renderPlay(); renderProgress(); break;
    case "NOW_PLAYING_STORED_MUSIC":
      $("title").textContent = d.name || "Ukendt nummer";
      $("artist").textContent = [d.artist, d.album].filter(Boolean).join(" · ");
      st.dur = d.duration || st.dur; renderProgress();
      if (d.playQueueItemId) { st.queueId = d.playQueueItemId; markQueue(); }
      break;
    case "NOW_PLAYING_NET_RADIO":
      $("title").textContent = d.name || "Radio";
      $("artist").textContent = d.liveDescription || d.genre || "";
      st.dur = 0; renderProgress(); break;
    case "NOW_PLAYING_ENDED":
      $("title").textContent = "Intet spiller"; $("artist").textContent = ""; break;
    case "PLAY_QUEUE_CHANGED":
      loadQueue(); break;
    case "_CONNECTION":
      setConn(false, "Moment svarer ikke"); return;
  }
  setConn(true);
}

function setConn(ok, text) { const c = $("conn"); c.className = ok ? "ok" : "bad"; c.textContent = text || (ok ? "forbundet" : "afbrudt"); }

// Lokal fremdrift mellem notifikationerne
setInterval(() => { if (st.playing && st.dur) { st.pos = Math.min(st.dur, st.pos + 1); renderProgress(); } }, 1000);

function connect() {
  const es = new EventSource("/events");
  es.onmessage = e => { try { onNotification(JSON.parse(e.data)); } catch {} };
  es.onerror = () => setConn(false, "afbrudt – prøver igen");
}

$("playpause").onclick = () => press(st.playing ? "Pause" : "Play");
$("next").onclick = () => press("Forward");
$("prev").onclick = () => press("Backward");
$("mute").onclick = () => api("PUT", "/BeoZone/Zone/Sound/Volume/Speaker/Muted", { muted: !st.muted }).then(() => renderVolume(null, !st.muted)).catch(() => {});

let volTimer;
$("vol").addEventListener("input", e => {
  st.dragging = true; $("volnum").textContent = e.target.value;
  clearTimeout(volTimer);
  volTimer = setTimeout(() => api("PUT", "/BeoZone/Zone/Sound/Volume/Speaker/Level", { level: +e.target.value }).catch(() => {}), 120);
});
$("vol").addEventListener("change", () => { setTimeout(() => st.dragging = false, 400); });

$("standby").onclick = () => api("PUT", "/BeoDevice/powerManagement/standby", { standby: { powerState: "standby" } }).catch(() => {});

loadInitial();
connect();
</script>
</body>
</html>
